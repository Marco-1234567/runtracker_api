# ================================
# RunTracker API - Application Config
# ================================
# Secrets are loaded from environment variables.
# For local development, create application-local.properties
# and add it to .gitignore ? never commit secrets!

spring.application.name=runtracker_api
server.port=8080

# ================================
# Database (Supabase / PostgreSQL)
# ================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ================================
# Strava OAuth
# ================================
strava.client-id=${STRAVA_CLIENT_ID}
strava.client-secret=${STRAVA_CLIENT_SECRET}
strava.redirect-uri=${STRAVA_REDIRECT_URI}
strava.token-url=https://www.strava.com/oauth/token
strava.auth-url=https://www.strava.com/oauth/authorize
strava.api-base-url=https://www.strava.com/api/v3

# ================================
# JWT (for securing API endpoints)
# ================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000